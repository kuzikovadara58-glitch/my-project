# Пример настроек приложения. Реальные, отличные от примера значения для
# конкретного тренера следует держать в отдельном каталоге, на который
# указывает переменная окружения JOURNAL_CONFIG_DIR (см. README.md) —
# так реальные данные не попадают в этот репозиторий даже случайно.

timezone: "Europe/Moscow"

automation:
  # Если указано — заполнение запускается через N минут после НАЧАЛА занятия.
  fill_after_start_minutes: 5
  # Используется, если fill_after_start_minutes не указан (null/отсутствует):
  # заполнение запускается через N минут после ОКОНЧАНИЯ занятия.
  fill_after_end_minutes: 10
  photo_time_tolerance_before_minutes: 30
  photo_time_tolerance_after_minutes: 120

# Подпапки создаются под пользовательским каталогом данных приложения
# (см. journal_automation/paths.py), а не рядом с программой и не в этом
# репозитории. Если указать абсолютный путь — он будет использован как есть.
paths:
  photos: "photos"
  data: "data"
  logs: "logs"

# Источник фотографий (этап 4). Пока folder_url пуст — источник фото
# отключён, планировщик работает без проверки фото, как на этапе 3. См.
# README.md, раздел "Google Drive — фотографии", для настройки.
photos:
  source: "google_drive"

  google_drive:
    # Обычная ссылка на папку Google Drive, например
    # https://drive.google.com/drive/folders/<id> — вставляется сюда позже.
    folder_url: ""
    # Альтернатива folder_url — просто идентификатор папки, если ссылки нет.
    folder_id: ""

  # Раздел 13: EXIF/имя файла — надёжные источники времени съёмки, метаданные
  # Google Drive (createdTime/modifiedTime) — нет. По умолчанию не используются.
  allow_drive_timestamp_fallback: false

  time_tolerance_before_minutes: 15
  time_tolerance_after_minutes: 120

  # Сколько минут после окончания занятия ждать появления фото в Google
  # Drive, прежде чем считать его отсутствующим (раздел 28).
  wait_for_photo_until_minutes_after_end: 30
  # Как часто повторно опрашивать Google Drive, пока фото не найдено.
  recheck_interval_seconds: 60
  # Сколько дней хранить временно скачанные фото в локальном кэше.
  cache_retention_days: 7
