# Пример данных о посещаемости на конкретные занятия. Это отдельное,
# привязанное к дате хранилище — не путать с постоянным составом группы
# (groups.yaml).
#
# Каждая запись — это ПОДТВЕРЖДЁННОЕ пользователем состояние посещаемости
# конкретного занятия:
#   confirmed_complete: true  — список athletes ниже полный, все остальные
#                               спортсмены группы действительно были на
#                               тренировке (даже если athletes: []).
#   confirmed_complete: false — данные ещё не подтверждены как полные, даже
#                               если часть отсутствующих уже известна;
#                               занятие остаётся в состоянии "ждёт данных".
#
# Для каждого отсутствующего указывается либо reason (ключ из
# absence_reasons.yaml), либо свой текст в comment — не оба сразу.

attendance:
  - date: "2026-09-28"
    group_id: "kids_1"
    confirmed_complete: true
    athletes:
      - athlete_id: "athlete_3"
        reason: "family"

  - date: "2026-09-30"
    group_id: "kids_1"
    confirmed_complete: true
    athletes: []
